---
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      ## Contents passé à write (au lieu de read) pour corriger
      # les problèmes d'accès API.
      # "statuses" n'étant pas géré par gitea, c'est la méthode pour habiliter le token
      # https://docs.gitea.com/usage/actions/token-permissions/#supported-scopes
      
      # contents permission to clone the repository
      contents: write
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          github-server-url: 'https://gitea1.eu-west-3.cgichaos.com'
          fetch-depth: 0
          persist-credentials: false

      - name: Add forced field
        run: |
          jq '. + {"forced": false}' "$GITHUB_EVENT_PATH" > event.json
          mv event.json "$GITHUB_EVENT_PATH"

      - name: Super-linter
        uses: super-linter/super-linter@v8.7.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_CUSTOM_API_URL: https://gitea1.eu-west-3.cgichaos.com/api/v1
          GITHUB_CUSTOM_SERVER_URL: https://gitea1.eu-west-3.cgichaos.com/
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_ALL_CODEBASE: "true"